name: update

on:
  workflow_dispatch:      # 手動実行
  schedule:
    - cron: "0 22 * * *"  # 毎日 07:10 JST 近辺（UTC 22:00）

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: キャッシュ（書類一覧）
        uses: actions/cache@v4
        with:
          path: cache/doclist
          key: doclist-${{ github.run_id }}
          restore-keys: doclist-

      # API キー未設定や EDINET 側の不調でも、コミット済み data/ からサイトは再生成する
      - name: 事業の内容を更新（全提出者・差分のみ）
        continue-on-error: true
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python scripts/update_all.py --all --days 500 --drop-csv

      - name: サイト生成
        run: python site/build.py

      - name: data/ をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: 事業の内容を更新 ($(date -u +%Y-%m-%d))"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
