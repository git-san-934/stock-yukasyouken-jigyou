<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>事業の内容ビューア</title><link rel="stylesheet" href="style.css"></head><body><main><h1>有価証券報告書 事業の内容ビューア</h1><div class="sub">EDINET の有価証券報告書から「事業の内容」を抽出。<a href="https://git-san-934.github.io/portal/">ポータルへ戻る</a></div><input id="q" type="search" placeholder="会社名・証券コード・本文で検索" autofocus><div id="count" class="count"></div><div id="list"></div><script>
const box = document.getElementById('q');
const list = document.getElementById('list');
const count = document.getElementById('count');
let data = [];
fetch('search.json').then(r => r.json()).then(d => { data = d; render(''); });
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hl(text, term){
  if (!term) return esc(text);
  const low = text.toLowerCase(); let out = '', i = 0;
  for (;;){
    const j = low.indexOf(term, i);
    if (j < 0){ out += esc(text.slice(i)); break; }
    out += esc(text.slice(i, j)) + '<mark>' + esc(text.slice(j, j + term.length)) + '</mark>';
    i = j + term.length;
  }
  return out;
}
function render(term){
  term = term.trim().toLowerCase();
  const hits = data.filter(c =>
    !term ||
    c.name.toLowerCase().includes(term) ||
    c.code.toLowerCase().includes(term) ||
    c.body.toLowerCase().includes(term));
  count.textContent = hits.length + ' 件';
  list.innerHTML = hits.map(c => {
    let snip = '';
    if (term){
      const i = c.body.toLowerCase().indexOf(term);
      if (i >= 0) snip = (i>40?'…':'') + c.body.slice(Math.max(0,i-40), i+80) + '…';
    }
    if (!snip) snip = c.body.slice(0, 90) + '…';
    const q = term ? '?q=' + encodeURIComponent(term) : '';
    return `<a class="card" href="companies/${encodeURIComponent(c.code)}.html${q}">
      <div class="code">${esc(c.code)}</div>
      <div class="name">${hl(c.name, term)}</div>
      <div class="snip">${hl(snip, term)}</div></a>`;
  }).join('');
}
box.addEventListener('input', () => render(box.value));
</script></main></body></html>
